# Gorp Kernel Manifest
#
# Identity of the Gorp governance kernel. The `version:` value below is the
# governance version the control plane stamps into every run record
# (runtime/control/src/run/run.ts governanceVersion() — /^version:/ scrape).
# Do not remove or rename that line.
#
# The 2026-07-27 cleanup removed the earlier context-distribution model this
# manifest used to declare (load order over doctrine/personas/playbooks,
# precedence classes, capability registries). Governance is now enforced in
# code by the control plane; see README.md and runtime/control/README.md.

version: 1

gorp:
  doctrine_version: "1.0.0"
  manifest_schema: 1

purpose: >-
  Gorp is the execution engine: runtime contracts (specs/runtime), persisted
  execution state (machine-local state root), and the enforcement mechanics
  that gate, review (hash binding), promote (fail-closed), and audit work.
  Contracts are source-neutral; worker runtimes integrate only through the
  worker-adapter seam. Gorp does not own planning, governance decisions, or
  Linear (guava-os owns those).

