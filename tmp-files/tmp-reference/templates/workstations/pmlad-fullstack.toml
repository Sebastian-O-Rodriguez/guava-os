# PM Lad — Full-stack development template
# Cross-cutting work: API + Web + packages. Both dev servers available.
# Usage: shoal new --template pmlad-fullstack -n my-fullstack-task

[template]
name = "pmlad-fullstack"
description = "PM Lad full-stack agent — API + Web + packages"
extends = "base-dev"
mixins = ["pmlad-env"]
tool = "opencode"

[template.env]
CLAUDECODE = ""
PMLAD_SCOPE = "fullstack"

[template.worktree]
name = "feat/{session_name}"
create_branch = true

[[windows]]
name = "agent"
focus = true

[[windows.panes]]
split = "root"
size = "60%"
title = "agent"
command = "{tool_command}"

[[windows.panes]]
split = "right"
size = "40%"
title = "terminal"
command = "echo '--- PM Lad Full-Stack ---' && echo 'API:   pnpm dev:api   (3001)' && echo 'Web:   pnpm dev:web2  (3002)' && echo 'Build: pnpm build' && echo 'Test:  pnpm test' && echo 'Lint:  pnpm lint'"

[[windows]]
name = "servers"

[[windows.panes]]
split = "root"
size = "50%"
title = "api-server"
command = "echo 'Run: pnpm dev:api'"

[[windows.panes]]
split = "right"
size = "50%"
title = "web-server"
command = "echo 'Run: pnpm dev:web2'"
