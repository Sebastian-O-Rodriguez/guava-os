# PM Lad — Robo supervisor template
# Orchestrates Phase E agents via Shoal MCP. No worktree — stays in project root.
# Usage: shoal new --template pmlad-robo -n phase-e-robo

[template]
name = "pmlad-robo"
description = "PM Lad robo supervisor — orchestrates agent sessions"
mixins = ["shoal-orchestrator"]
tool = "claude"

[template.env]
SHOAL_ROBO = "1"
# Prevent "nested session" error when launched from a VS Code Claude session
CLAUDECODE = ""

[[windows]]
name = "robo"
focus = true

[[windows.panes]]
split = "root"
size = "65%"
title = "agent"
command = "{tool_command}"

[[windows.panes]]
split = "right"
size = "35%"
title = "terminal"
command = "echo '--- PM Lad Robo ---' && echo 'shoal ls        — list sessions' && echo 'shoal status    — check status' && echo 'shoal attach    — attach to agent'"
