version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pmlad_db
    environment:
      POSTGRES_USER: pmlad
      POSTGRES_PASSWORD: pmlad
      POSTGRES_DB: pmlad
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmlad -d pmlad"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pmlad_api
    environment:
      # Critical blocker: ADMIN_BOOTSTRAP_TOKEN must be set
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN}
      API_KEY: ${API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_CURRENT: ${JWT_SECRET_CURRENT}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      NODE_ENV: production
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web2/Dockerfile
    container_name: pmlad_web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://api:3001
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
