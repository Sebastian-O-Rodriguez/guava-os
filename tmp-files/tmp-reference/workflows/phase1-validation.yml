name: Phase 1 Validation

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
      - 'phase1/*'
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'package.json'
      - '.github/workflows/phase1-validation.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'package.json'
      - '.github/workflows/phase1-validation.yml'

jobs:
  phase1-validation:
    name: Phase 1 E2E Validation & Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmlad
          POSTGRES_PASSWORD: pmlad
          POSTGRES_DB: pmlad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pmlad -d pmlad_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pmlad:pmlad@localhost:5432/pmlad_test?schema=public
      API_KEY: test-api-key-phase1-validation
      JWT_SECRET: test-jwt-secret-phase1-validation-must-be-32-chars-minimum
      JWT_SECRET_CURRENT: test-jwt-secret-phase1-validation-must-be-32-chars-minimum
      JWT_SECRET_PREVIOUS: ''
      JWT_ISSUER: pmlad-api-phase1
      JWT_AUDIENCE: pmlad-clients
      ADMIN_BOOTSTRAP_TOKEN: test-bootstrap-token-32-bytes-minimum-phase1
      RATE_LIMIT_ENABLED: 'true'
      BOOTSTRAP_ENABLED: 'true'
      API_URL: http://localhost:3001
      SOFT_DELETE_FILTERING_ENABLED: 'false'
      RL_TEST_PREFIX: 'rl:${{ github.run_id }}:${{ github.run_attempt }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and use pnpm@10.17.1
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @pmlad/api exec prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Prisma migrations
        run: pnpm --filter @pmlad/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build packages
        run: pnpm build

      - name: Create artifacts directories
        run: mkdir -p artifacts/phase1/validation artifacts/phase1/explain

      - name: Run Phase 1 Validation Suite
        run: pnpm --filter @pmlad/api test:phase1-validation
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          API_KEY: ${{ env.API_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_ISSUER: ${{ env.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ env.JWT_AUDIENCE }}
          ADMIN_BOOTSTRAP_TOKEN: ${{ env.ADMIN_BOOTSTRAP_TOKEN }}
          RATE_LIMIT_ENABLED: ${{ env.RATE_LIMIT_ENABLED }}
          BOOTSTRAP_ENABLED: ${{ env.BOOTSTRAP_ENABLED }}

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-phase1
          path: artifacts/phase1/validation/junit.xml
          retention-days: 30

      - name: Start API server (for benchmarks)
        run: |
          cd apps/api
          node dist/main.js &
          echo $! > api.pid
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          API_KEY: ${{ env.API_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_ISSUER: ${{ env.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ env.JWT_AUDIENCE }}
          ADMIN_BOOTSTRAP_TOKEN: ${{ env.ADMIN_BOOTSTRAP_TOKEN }}
          PORT: 3001

      - name: Wait for API health check
        run: |
          echo "Waiting for API health check..."
          for i in {1..30}; do
            if curl -sSf http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ API healthy after ${i}s"
              exit 0
            fi
            echo "⏳ Attempt $i/30..."
            sleep 1
          done
          echo "❌ API failed to become healthy in 30s"
          echo "📋 API logs (last 50 lines):"
          tail -n 50 apps/api/api.log || echo "No API log file found"
          echo "🔍 Process status:"
          ps aux | grep -i node || echo "No node processes found"
          exit 1

      - name: Run Phase 1 Benchmarks
        run: pnpm --filter @pmlad/api benchmark:phase1
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          API_URL: ${{ env.API_URL }}
          API_KEY: ${{ env.API_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_ISSUER: ${{ env.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ env.JWT_AUDIENCE }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-phase1
          path: artifacts/phase1/validation/bench.csv
          retention-days: 30

      - name: Generate SQL EXPLAIN plans
        run: pnpm --filter @pmlad/api test:explain
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload EXPLAIN plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explain-plans-phase1
          path: artifacts/phase1/explain/
          retention-days: 30

      - name: Export OpenAPI from live API
        run: curl -sSf http://localhost:3001/docs/json > apps/api/openapi-bundle.json

      - name: Lint OpenAPI spec
        run: |
          pnpm dlx @redocly/cli@latest lint apps/api/openapi-bundle.json
          jq -e '.info.title, .paths' apps/api/openapi-bundle.json

      - name: Generate validation summary
        run: node scripts/merge-validation.js > artifacts/phase1/validation-summary.json

      - name: Verify required artifacts
        run: |
          set -e
          required=(
            "artifacts/phase1/validation/junit.xml"
            "artifacts/phase1/validation/bench.csv"
            "apps/api/openapi-bundle.json"
            "artifacts/phase1/validation-summary.json"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              missing=$((missing + 1))
            else
              size=$(wc -c < "$f")
              echo "✅ Found: $f (${size} bytes)"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "ERROR: $missing required artifact(s) missing"
            exit 1
          fi

      - name: Upload OpenAPI bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-bundle-phase1
          path: apps/api/openapi-bundle.json
          retention-days: 30

      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary-phase1
          path: artifacts/phase1/validation-summary.json
          retention-days: 30

      - name: Stop API server
        if: always()
        run: |
          if [ -f apps/api/api.pid ]; then
            kill $(cat apps/api/api.pid) || true
            rm apps/api/api.pid
          fi

      - name: Check acceptance criteria
        run: |
          echo "📊 Phase 1 Validation Complete"
          echo ""
          echo "Checking acceptance criteria..."

          # Check if JUnit XML exists
          if [ -f artifacts/phase1/validation/junit.xml ]; then
            echo "✅ JUnit XML generated"
          else
            echo "❌ JUnit XML missing"
            exit 1
          fi

          # Check if benchmark CSV exists
          if [ -f artifacts/phase1/validation/bench.csv ]; then
            echo "✅ Benchmark CSV generated"

            # Parse CSV and check p95 < 250ms
            echo ""
            echo "📈 Benchmark Results:"
            tail -n +2 artifacts/phase1/validation/bench.csv | while IFS=, read -r endpoint method iter p50 p95 p99 mean min max throughput success; do
              echo "  $method $endpoint: p95=${p95}ms"
              if (( $(echo "$p95 > 250" | bc -l) )); then
                echo "  ⚠️  WARNING: p95 exceeds 250ms target"
              fi
            done
          else
            echo "❌ Benchmark CSV missing"
            exit 1
          fi

          echo ""
          echo "✅ Phase 1 validation artifacts generated successfully"

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 📊 Phase 1 Validation Results\n\n';

            // Read benchmark results
            if (fs.existsSync('artifacts/phase1/validation/bench.csv')) {
              const csv = fs.readFileSync('artifacts/phase1/validation/bench.csv', 'utf8');
              const lines = csv.trim().split('\n');

              comment += '### Performance Baseline\n\n';
              comment += '| Endpoint | Method | p50 | p95 | p99 | Status |\n';
              comment += '|----------|--------|-----|-----|-----|--------|\n';

              for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                const endpoint = cols[0].replace(/"/g, '');
                const method = cols[1];
                const p50 = parseFloat(cols[3]).toFixed(2);
                const p95 = parseFloat(cols[4]).toFixed(2);
                const p99 = parseFloat(cols[5]).toFixed(2);
                const status = parseFloat(p95) < 250 ? '✅' : '⚠️';

                comment += `| ${endpoint} | ${method} | ${p50}ms | ${p95}ms | ${p99}ms | ${status} |\n`;
              }
            }

            comment += '\n### Artifacts\n\n';
            comment += '- ✅ JUnit XML report\n';
            comment += '- ✅ Benchmark CSV\n';
            comment += '- ✅ SQL EXPLAIN plans\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
