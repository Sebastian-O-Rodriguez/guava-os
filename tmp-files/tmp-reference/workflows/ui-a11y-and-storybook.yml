name: UI A11y & Storybook

on:
  push: { branches: [main] }
  pull_request:
    paths:
      - 'apps/web2/**'
      - 'packages/ui/**'
      - 'packages/types/**'
      - '.github/workflows/ui-a11y-and-storybook.yml'

jobs:
  ui-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack and use pnpm@10.17.1
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Install Playwright browsers
        working-directory: apps/web2
        run: pnpm exec playwright install chromium --with-deps

      - name: Run unit tests
        run: pnpm --filter @pmlad/web2 test || echo "No tests found - skipping"
        continue-on-error: true

      - name: Run a11y tests (WCAG 2.1 AA)
        working-directory: apps/web2
        run: pnpm test:a11y

      - name: Build Storybook
        run: pnpm --filter @pmlad/web2 sb:build

      - name: Upload Storybook artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/web2/storybook-static/
          retention-days: 7
