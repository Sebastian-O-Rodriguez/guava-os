name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: quick build check to ensure images will compile
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @pmlad/types --filter @pmlad/ui --filter @pmlad/widgets --filter @pmlad/db --filter @pmlad/utils build

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build API
        run: pnpm --filter @pmlad/api build

      - name: Build Web
        run: pnpm --filter @pmlad/web2 build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  # Build Docker images and push to ACR
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [ci-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: pmladacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build API image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t pmladacr.azurecr.io/pmlad-api:${{ github.sha }} \
            -t pmladacr.azurecr.io/pmlad-api:latest \
            --build-arg GIT_SHA=${{ github.sha }} \
            .

      - name: Build Web image
        run: |
          docker build \
            -f apps/web2/Dockerfile \
            -t pmladacr.azurecr.io/pmlad-web:${{ github.sha }} \
            -t pmladacr.azurecr.io/pmlad-web:latest \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN_WEB }} \
            .

      - name: Push API image
        run: |
          docker push pmladacr.azurecr.io/pmlad-api:${{ github.sha }}
          docker push pmladacr.azurecr.io/pmlad-api:latest

      - name: Push Web image
        run: |
          docker push pmladacr.azurecr.io/pmlad-web:${{ github.sha }}
          docker push pmladacr.azurecr.io/pmlad-web:latest

  # Deploy to staging Container Apps
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    environment: staging
    outputs:
      api-fqdn: ${{ steps.deploy-api.outputs.fqdn }}
      web-fqdn: ${{ steps.deploy-web.outputs.fqdn }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to staging
        id: deploy-api
        run: |
          az containerapp update \
            --name pmlad-api-staging \
            --resource-group pmlad-prod \
            --image pmladacr.azurecr.io/pmlad-api:${{ github.sha }}

          FQDN=$(az containerapp show \
            --name pmlad-api-staging \
            --resource-group pmlad-prod \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "Staging API FQDN: $FQDN"

      - name: Deploy Web to staging
        id: deploy-web
        run: |
          az containerapp update \
            --name pmlad-web-staging \
            --resource-group pmlad-prod \
            --image pmladacr.azurecr.io/pmlad-web:${{ github.sha }}

          FQDN=$(az containerapp show \
            --name pmlad-web-staging \
            --resource-group pmlad-prod \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "Staging Web FQDN: $FQDN"

  # Smoke tests against staging
  smoke-tests:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - name: Wait for cold start
        run: sleep 30

      - name: API health check
        run: |
          API_FQDN="${{ needs.deploy-staging.outputs.api-fqdn }}"
          echo "==> Checking https://$API_FQDN/health"

          for i in 1 2 3 4 5; do
            BODY=$(curl -sf "https://$API_FQDN/health" || true)
            STATUS_FIELD=$(echo "$BODY" | jq -r '.status // empty' 2>/dev/null || true)
            echo "Attempt $i: status=$STATUS_FIELD"
            if [ "$STATUS_FIELD" = "healthy" ] || [ "$STATUS_FIELD" = "degraded" ]; then
              echo "API health: $STATUS_FIELD"
              echo "$BODY" | jq .
              exit 0
            fi
            sleep 10
          done
          echo "API health check failed after 5 attempts"
          exit 1

      - name: API build info check
        run: |
          API_FQDN="${{ needs.deploy-staging.outputs.api-fqdn }}"
          BODY=$(curl -sf "https://$API_FQDN/health/info")
          echo "$BODY" | jq .

          ENV=$(echo "$BODY" | jq -r '.env')
          BUILD=$(echo "$BODY" | jq -r '.build')
          echo "env=$ENV build=$BUILD"

          if [ "$BUILD" = "null" ] || [ -z "$BUILD" ]; then
            echo "Missing build SHA in /health/info"
            exit 1
          fi

      - name: API auth guard check
        run: |
          API_FQDN="${{ needs.deploy-staging.outputs.api-fqdn }}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://$API_FQDN/v1/orgs" || true)
          echo "GET /v1/orgs (no token): HTTP $STATUS"
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "Auth guard not working — expected 401/403, got $STATUS"
            exit 1
          fi
          echo "Auth guard OK"

      - name: Swagger docs reachable
        run: |
          API_FQDN="${{ needs.deploy-staging.outputs.api-fqdn }}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://$API_FQDN/docs" || true)
          echo "GET /docs: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Swagger docs not reachable"
            exit 1
          fi
          echo "Swagger docs OK"

      - name: Web app reachable
        run: |
          WEB_FQDN="${{ needs.deploy-staging.outputs.web-fqdn }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$WEB_FQDN" || true)
          echo "GET / (web): HTTP $STATUS"
          # 200 = OK, 307 = Clerk auth redirect (expected for unauthenticated)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "307" ]; then
            echo "Web app not reachable (expected 200 or 307)"
            exit 1
          fi
          echo "Web app OK"

  # Deploy to production (requires manual approval)
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    environment: production
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to production
        run: |
          az containerapp update \
            --name pmlad-api \
            --resource-group pmlad-prod \
            --image pmladacr.azurecr.io/pmlad-api:${{ github.sha }}

      - name: Deploy Web to production
        run: |
          az containerapp update \
            --name pmlad-web \
            --resource-group pmlad-prod \
            --image pmladacr.azurecr.io/pmlad-web:${{ github.sha }}

      - name: Post-deploy health check
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            BODY=$(curl -sf "https://api.pmlad.com/health" || true)
            STATUS_FIELD=$(echo "$BODY" | jq -r '.status // empty' 2>/dev/null || true)
            echo "Attempt $i: status=$STATUS_FIELD"
            if [ "$STATUS_FIELD" = "healthy" ] || [ "$STATUS_FIELD" = "degraded" ]; then
              echo "Production API: $STATUS_FIELD"
              exit 0
            fi
            sleep 10
          done

          echo "Production API health check failed after 5 attempts"
          exit 1

  # Create Sentry release after production deploy
  sentry-release:
    name: Sentry Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release (Web)
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: javascript-nextjs
        with:
          environment: production
          set_commits: auto

      - name: Create Sentry release (API)
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: pmlad-api
        with:
          environment: production
          set_commits: auto
