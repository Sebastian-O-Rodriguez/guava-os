name: Performance Guard

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - ".github/workflows/perf-guard.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
      - "phase1/*"
    paths:
      - "apps/api/**"
      - "packages/**"

jobs:
  perf-guard:
    name: Performance Regression Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmlad
          POSTGRES_PASSWORD: pmlad
          POSTGRES_DB: pmlad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pmlad -d pmlad_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pmlad:pmlad@localhost:5432/pmlad_test?schema=public
      API_KEY: test-api-key-perf-guard
      JWT_SECRET: test-jwt-secret-perf-guard-32-chars-minimum
      JWT_SECRET_CURRENT: test-jwt-secret-perf-guard-32-chars-minimum
      JWT_SECRET_PREVIOUS: ""
      JWT_ISSUER: pmlad-api-perf
      JWT_AUDIENCE: pmlad-clients
      ADMIN_BOOTSTRAP_TOKEN: test-bootstrap-token-32-bytes-minimum-perf
      RATE_LIMIT_ENABLED: "true"
      BOOTSTRAP_ENABLED: "true"
      API_URL: http://localhost:3001
      RL_TEST_PREFIX: "rl:${{ github.run_id }}:${{ github.run_attempt }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and use pnpm@10.17.1
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @pmlad/api exec prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Prisma migrations
        run: pnpm --filter @pmlad/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Build all packages in dependency order (includes @pmlad/db, @pmlad/types, @pmlad/api)
      - name: Build packages
        run: pnpm build

      - name: Create artifacts directories
        run: |
          mkdir -p artifacts/phase1/validation
          mkdir -p artifacts/phase1/history

      - name: Start API server
        run: |
          cd apps/api
          node dist/main.js &
          echo $! > api.pid
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          API_KEY: ${{ env.API_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_ISSUER: ${{ env.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ env.JWT_AUDIENCE }}
          ADMIN_BOOTSTRAP_TOKEN: ${{ env.ADMIN_BOOTSTRAP_TOKEN }}
          PORT: 3001

      - name: Wait for API health check
        run: |
          echo "Waiting for API health check..."
          for i in {1..30}; do
            if curl -sSf http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ API healthy after ${i}s"
              exit 0
            fi
            echo "⏳ Attempt $i/30..."
            sleep 1
          done
          echo "❌ API failed to become healthy in 30s"
          echo "📋 API logs (last 50 lines):"
          tail -n 50 apps/api/api.log 2>/dev/null || echo "No API log file found"
          echo "🔍 Process status:"
          ps aux | grep -i node || echo "No node processes found"
          exit 1

      - name: Run Phase 1 Benchmarks
        run: pnpm --filter @pmlad/api benchmark:phase1
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          API_URL: ${{ env.API_URL }}
          API_KEY: ${{ env.API_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_ISSUER: ${{ env.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ env.JWT_AUDIENCE }}

      - name: Stop API server
        if: always()
        run: |
          if [ -f apps/api/api.pid ]; then
            kill $(cat apps/api/api.pid) || true
            rm apps/api/api.pid
          fi

      - name: Archive benchmark history
        if: success()
        run: |
          # Keep last 5 benchmark runs
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          cp artifacts/phase1/validation/bench.csv artifacts/phase1/history/bench-${TIMESTAMP}.csv
          cp artifacts/phase1/validation/bench.json artifacts/phase1/history/bench-${TIMESTAMP}.json

          # Clean old history (keep last 5)
          ls -t artifacts/phase1/history/bench-*.csv | tail -n +6 | xargs -r rm
          ls -t artifacts/phase1/history/bench-*.json | tail -n +6 | xargs -r rm

      - name: Compare against baseline
        id: compare
        run: |
          pnpm --filter @pmlad/api bench:compare
        continue-on-error: true

      - name: Upload current benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-current
          path: |
            artifacts/phase1/validation/bench.csv
            artifacts/phase1/validation/bench.json
          retention-days: 30

      - name: Upload benchmark history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: artifacts/phase1/history/
          retention-days: 90

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-comparison
          path: artifacts/phase1/validation/perf-comparison.md
          retention-days: 30

      - name: Post PR comment with performance comparison
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🚀 Performance Guard Report\n\n';

            // Check if comparison markdown exists
            const comparisonPath = 'artifacts/phase1/validation/perf-comparison.md';
            if (fs.existsSync(comparisonPath)) {
              const comparisonMd = fs.readFileSync(comparisonPath, 'utf8');
              comment += comparisonMd;
            } else {
              comment += '⚠️ No baseline found. This will be set as the new baseline.\n\n';

              // Show current benchmark results
              if (fs.existsSync('artifacts/phase1/validation/bench.json')) {
                const bench = JSON.parse(fs.readFileSync('artifacts/phase1/validation/bench.json', 'utf8'));

                comment += '### Current Benchmark Results\n\n';
                comment += '| Endpoint | Method | p50 | p95 | p99 | Throughput |\n';
                comment += '|----------|--------|-----|-----|-----|------------|\n';

                bench.results.forEach(r => {
                  comment += `| \`${r.endpoint}\` | ${r.method} | ${r.p50.toFixed(1)}ms | ${r.p95.toFixed(1)}ms | ${r.p99.toFixed(1)}ms | ${r.throughput.toFixed(1)} req/s |\n`;
                });
              }
            }

            comment += '\n---\n';
            comment += '*Performance guard checks that p95 latency does not exceed baseline by > 10%*\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on performance regression
        if: steps.compare.outcome == 'failure'
        run: |
          echo "❌ Performance regression detected!"
          echo "   Review the comparison report above."
          echo "   If this is expected, update the baseline with: pnpm bench:set-baseline"
          exit 1

      - name: Performance guard passed
        if: steps.compare.outcome == 'success'
        run: |
          echo "✅ No performance regressions detected"
          echo "   All endpoints within 10% of baseline"
