name: API E2E

on:
  push:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'package.json'
      - '.github/workflows/api-e2e.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'package.json'
      - '.github/workflows/api-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        suite: [tenants, properties]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmlad
          POSTGRES_PASSWORD: pmlad
          POSTGRES_DB: pmlad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pmlad -d pmlad_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pmlad:pmlad@localhost:5432/pmlad_test?schema=public
      PORT: 3001
      API_URL: http://localhost:3001/v1
      JWT_SECRET: test-jwt-secret-e2e-32-chars-minimum
      JWT_SECRET_CURRENT: test-jwt-secret-e2e-32-chars-minimum
      JWT_SECRET_PREVIOUS: ''
      JWT_ISSUER: pmlad-api-e2e
      JWT_AUDIENCE: pmlad-clients
      API_KEY: test-api-key-e2e
      ADMIN_BOOTSTRAP_TOKEN: test-bootstrap-token-32-bytes-minimum-e2e
      RATE_LIMIT_ENABLED: 'true'
      BOOTSTRAP_ENABLED: 'true'
      RL_TEST_PREFIX: 'rl:${{ github.run_id }}:${{ github.run_attempt }}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and use pnpm@10.17.1
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Prisma needs generated client before build
      - name: Prisma generate
        run: pnpm -F @pmlad/api prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Apply migrations (deploy)
        run: pnpm -F @pmlad/api prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database
        run: pnpm -F @pmlad/api prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # Build packages in dependency order (Turborepo handles this)
      - name: Build packages
        run: pnpm build

      - name: Start API
        run: node dist/main.js &
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: ${{ env.PORT }}

      - name: Wait for /health
        run: |
          echo "Waiting for API health check..."
          for i in {1..30}; do
            if curl -sSf http://localhost:${PORT:-3001}/health >/dev/null 2>&1; then
              echo "✅ API healthy after ${i}s"
              exit 0
            fi
            echo "⏳ Attempt $i/30..."
            sleep 1
          done
          echo "❌ API failed to become healthy in 30s"
          echo "📋 API logs (last 50 lines):"
          tail -n 50 apps/api/api.log 2>/dev/null || echo "No API log file found"
          echo "🔍 Process status:"
          ps aux | grep -i node || echo "No node processes found"
          exit 1

      - name: Run E2E – ${{ matrix.suite }}
        env:
          API_URL: ${{ env.API_URL }}
          UNIQUE_SUFFIX: ${{ github.run_id }}
        run: |
          if [ "${{ matrix.suite }}" = "tenants" ]; then
            pnpm e2e:tenants
          else
            pnpm e2e:properties
          fi

      # Optional: keep logs if something fails
      - name: Debug on failure
        if: failure()
        run: |
          echo "---- Node processes ----"
          ps aux | grep node || true
          echo "---- Health check ----"
          curl -i http://localhost:${PORT:-3001}/health || true
