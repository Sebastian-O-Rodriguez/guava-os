# Scope Overlay — guava-os
#
# Extends the global scope policy (runtime/policies/scope.yml).
# TIGHTEN-ONLY: may add denies or narrow allows; never loosens, never adds to
# global always_allow, never grants secret access.

tighten_only: true

# guava-os inherits the global scope policy. No project-wide write scopes are
# granted here; per-task declared scope plus global always_allow govern writes.
allowed: []

# No additional project denies beyond the global always_deny set.
deny: []
